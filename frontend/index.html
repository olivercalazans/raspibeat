<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RaspiBeat</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <h1>RaspiBeat</h1>
  
  <div class="upload-container">
    <label for="file-upload" class="upload-btn">+ Add Music</label>
    <input id="file-upload" type="file" multiple accept=".mp3,.flac,.m4a,.ogg" />
  </div>
  
  <ul id="library"></ul>

  <div id="player-container">
    <audio id="player" controls></audio>
  </div>

  <script src="script.js" defer></script>
</body>
</html>
